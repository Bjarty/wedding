# Beoordeelbare testtemplate. Kopieer dit bestand uitsluitend lokaal naar
# wrangler.test.local.toml en vervang daar de twee placeholders door ongebruikte,
# onderling verschillende positieve integers uit het doelaccount. Het lokale
# bestand is genegeerd door Git.
name = "lisette-bjarty-rsvp-api-test"
main = "src/index.ts"
compatibility_date = "2026-08-29"
workers_dev = false
preview_urls = true

[vars]
ALLOWED_ORIGIN = "http://localhost:3000"
TURNSTILE_EXPECTED_HOSTNAME = "localhost"
TURNSTILE_EXPECTED_ACTION = "test"

[secrets]
required = [
  "TURNSTILE_SECRET",
  "WRITER_URL",
  "WRITER_HMAC_SECRET",
  "INVITATION_TOKEN_HASH_SECRET",
]

[[ratelimits]]
name = "RESOLVE_RATE_LIMITER"
namespace_id = "REPLACE_WITH_UNUSED_POSITIVE_INTEGER_RESOLVE"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "SUBMIT_RATE_LIMITER"
namespace_id = "REPLACE_WITH_UNUSED_POSITIVE_INTEGER_SUBMIT"
simple = { limit = 5, period = 60 }

# Geen route, custom domain, account-ID of secretwaarde toevoegen. De eerste
# upload gebruikt een tijdelijk secrets-bestand buiten de repository; verwijder
# dat bestand direct na de upload.
