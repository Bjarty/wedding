name: Pull request build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types, content and RSVP
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify custom domain
        shell: bash
        run: |
          test -f dist/CNAME
          test "$(tr -d '\r\n' < dist/CNAME)" = "lisetteenbjarty.nl"
